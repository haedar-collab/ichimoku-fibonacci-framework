<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Tradesys Edge IchiFib</title>
<script>try{var th=JSON.parse(localStorage.getItem("tsif_theme"));if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work: a professional trading desk, short words, exact numbers
   IDEA an order ticket beside a price plate under the cloud: every signal becomes a ladder of entry, stop and targets
   PICTURE candlestick plate with the Kumo projected ahead, the Fibonacci leg and the plan drawn on it, beside the plan ladder
   COLOUR white ground, ink; prussian = Ichimoku, burnt orange = Fibonacci; green/red Kumo, red stop, green targets
   TYPE IBM Plex Sans throughout, tabular figures
   LAYOUT header with language + scan; KPI strip; chart 1.7fr + plan 1fr; signal board below; phone stacks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1116);--ink:light-dark(#0f1419,#e6e9ef);--mute:light-dark(#5f6b7a,#94a0b2);--rule:light-dark(#e4e7ec,#252b35);--panel:light-dark(#f6f7f9,#151a21);--tf:light-dark(#0b4f8a,#5aa2ec);--mr:light-dark(#b54708,#f79009);--sl:light-dark(#c1121f,#ff6b6b);--tp:light-dark(#067647,#47cd89);--warn:light-dark(#8a5a00,#e3b341);--tfbg:light-dark(#e7eff8,#132a44);--mrbg:light-dark(#fdf0e6,#3b2410)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,3vw)}
header{border-bottom:1px solid var(--rule);background:var(--bg);position:sticky;top:0;z-index:5}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px 8px}
.brand{display:flex;flex-direction:column}
.brand b{font-size:22px;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:13px;color:var(--mute)}
.grow{flex:1}
.status{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.dot.live{background:var(--tp)}
h2{font-size:clamp(20px,2.4vw,26px);line-height:1.15;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
h3{font-size:16px;margin:0 0 10px}
button,select,input{font:inherit;font-size:16px;color:var(--ink)}
button{min-height:44px;padding:0 14px;border:1px solid var(--rule);background:var(--bg);border-radius:6px;cursor:pointer;font-weight:500}
button:hover{background:var(--panel)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--tf);outline-offset:2px}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.pri:hover{opacity:.88}
button.sm{min-height:34px;padding:0 10px;font-size:14px}
button:disabled{opacity:.5;cursor:wait}
select,input{min-height:44px;padding:0 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:42px;padding:0 12px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button svg{vertical-align:-3px;margin-right:6px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;padding:9px 13px;color:var(--mute);text-decoration:none;border-bottom:2px solid transparent;font-size:14px;font-weight:500}
nav a.on{color:var(--ink);border-color:var(--ink)}
.prog{height:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--tf);transition:width .3s}
section.view{display:none;padding-block:20px 48px}
section.view.on{display:block}
.lede{color:var(--mute);margin:0 0 16px;max-width:75ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:14px 0 18px}
.kpi{background:var(--bg);padding:11px 14px}
.kpi small{display:block;color:var(--mute);font-size:13px}
.kpi b{display:block;font-size:clamp(19px,2.2vw,24px);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.25}
.mix{display:flex;height:8px;border-radius:2px;overflow:hidden;margin:7px 0 4px;background:var(--panel)}
.mix i{display:block;height:100%}
.dgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{border:1px solid var(--rule);border-radius:8px;padding:14px;background:var(--bg)}
.fig{position:relative;min-height:400px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig.sm{min-height:250px}
svg text{font:12.5px "IBM Plex Sans",system-ui,sans-serif;fill:var(--mute);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.chead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-bottom:6px}
.chead b{font-size:17px}
.key{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:13px;color:var(--mute)}
.key i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
.pill{display:inline-block;font-size:12.5px;font-weight:500;padding:1px 8px;border-radius:20px;white-space:nowrap;border:1px solid currentColor}
.pill.ICH{color:var(--tf);background:var(--tfbg);border-color:transparent}
.pill.FIB{color:var(--mr);background:var(--mrbg);border-color:transparent}
.pill.Above{color:var(--tp)}
.pill.Inside{color:var(--warn)}
.pill.Below{color:var(--sl)}
.plan .ph{display:flex;justify-content:space-between;gap:8px;align-items:start;margin-bottom:10px}
.plan .ph b{font-size:19px;display:block}
.score{font-size:13px;color:var(--mute);text-align:right;white-space:nowrap}
.score b{font-size:22px;color:var(--ink)}
.ladder{border-top:1px solid var(--rule)}
.rung{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0 8px 10px;border-bottom:1px solid var(--rule);border-left:3px solid var(--rule)}
.rung.tp{border-left-color:var(--tp)}
.rung.en{border-left-color:var(--ink);background:var(--panel)}
.rung.sl{border-left-color:var(--sl)}
.rung .lb{font-weight:600;font-size:14px;width:76px}
.rung .px{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.rung .ds{font-size:13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rung .nt{grid-column:2/4;font-size:12.5px;color:var(--mute)}
.rung.tp .ds{color:var(--tp)}
.rung.sl .ds{color:var(--sl)}
.psize{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0;font-size:13px;color:var(--mute)}
.psize b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.plan ol{margin:0 0 8px;padding-left:18px;font-size:14px}
.plan ol li{margin-bottom:3px}
.valid{font-size:13px;color:var(--mute);margin:6px 0 12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1;white-space:nowrap;padding:0 10px}
.empty{color:var(--mute);padding:18px;border:1px dashed var(--rule);border-radius:6px;font-size:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;text-align:left;color:var(--mute);border-bottom:1px solid var(--ink);padding:8px;white-space:nowrap;font-size:13px}
td{border-bottom:1px solid var(--rule);padding:8px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.sl{color:var(--sl)}
td.tp{color:var(--tp)}
tr.click{cursor:pointer}
tr.click:hover td,tr.sel td{background:var(--panel)}
.bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.bar-row label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;font-size:14px}
.chips button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
details.guide{margin-top:22px;border-top:1px solid var(--rule);padding-top:12px}
details.guide summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.gcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:10px;font-size:14px}
.gcols ul{padding-left:18px;margin:0}
.gcols li{margin-bottom:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 20px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.form label.cb{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:14px}
.form input[type=checkbox]{width:22px;height:22px;min-height:0}
fieldset{border:1px solid var(--rule);border-radius:8px;padding:14px 16px 16px;margin:0 0 14px}
legend{font-weight:600;padding:0 6px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.big{font-size:clamp(30px,4.6vw,46px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:14px;margin-top:12px}
.kv span:nth-child(2n){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;background:var(--panel);font-size:14px;margin:0 0 14px}
.alert{border-bottom:1px solid var(--rule);padding:10px 0;font-size:14px;font-variant-numeric:tabular-nums}
.alert small{color:var(--mute);display:block}
.tgbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
#tgMsg{font-size:13px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
@media(max-width:960px){.dgrid{grid-template-columns:minmax(0,1fr)}.gcols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){#themeSeg span{display:none}#themeSeg svg{margin:0}.kpi:last-child:nth-child(odd){grid-column:1/-1}.calc{grid-template-columns:minmax(0,1fr)}.fig{min-height:320px}table{font-size:13px}th,td{padding:6px 5px}.brand span{display:none}.top{gap:8px}}
.nowrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;margin-bottom:10px}
.nowrow b{font-size:18px;font-variant-numeric:tabular-nums}
.nowrow small{color:var(--mute);font-size:12.5px}
.stt{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.stt.ok{color:var(--tp);background:color-mix(in srgb,var(--tp) 12%,transparent)}
.stt.wn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.stt.bad{color:var(--sl);background:color-mix(in srgb,var(--sl) 12%,transparent)}
.prob{border:1px solid var(--rule);border-radius:6px;padding:10px;margin:12px 0}
.prob .pr{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.prob .pr span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pb{height:7px;background:var(--panel);border-radius:4px;overflow:hidden}
.pb i{display:block;height:100%}
.cf{font-weight:600;white-space:nowrap}
.cf.high{color:var(--tp)}
.cf.med{color:var(--warn)}
.cf.low,.cf.low_n{color:var(--mute)}
.live{font-variant-numeric:tabular-nums}
@media(max-width:1360px){#themeSeg span{display:none}#themeSeg svg{margin:0}}
.lyr button{border-color:var(--rule);opacity:.55;display:inline-flex;gap:6px;align-items:center}
.lyr button.on{opacity:1;border-color:var(--ink);background:var(--bg);color:var(--ink)}
.lyr button i{display:inline-block;width:14px;height:3px}
.ck{list-style:none;padding:0;margin:8px 0 0;font-size:13.5px}
.ck li{padding:2px 0}
.ck li.y{color:var(--tp)}
.ck li.n{color:var(--mute)}
.h1{color:var(--tp);font-weight:600}.h-1{color:var(--sl);font-weight:600}.h0{color:var(--warn);font-weight:600}.hna{color:var(--mute)}
td small{font-size:12px;opacity:.85;margin-left:2px}
</style>
<body>
<header>
  <div class="wrap top">
    <div class="brand"><b>Tradesys Edge IchiFib</b><span data-i="sub"></span></div>
    <div class="grow"></div>
    <div class="status"><span class="dot" id="dot"></span><span id="stxt"></span></div>
    <select id="qtf" aria-label="Timeframe"><option value="1h">1H</option><option value="4h">4H</option><option value="1d">1D</option></select>
    <div class="seg" id="themeSeg" role="group" aria-label="Theme"><button data-theme-set="light"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg><span data-i="th_light"></span></button><button data-theme-set="dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span data-i="th_dark"></span></button></div>
    <div class="seg" id="langSeg" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="id">ID</button></div>
    <button class="pri" id="scanBtn" data-i="scan"></button>
  </div>
  <div class="prog"><i id="prog"></i></div>
  <div class="wrap"><nav id="nav">
    <a href="#dashboard" data-v="dashboard" data-i="n_dashboard"></a><a href="#scanner" data-v="scanner" data-i="n_scanner"></a><a href="#chart" data-v="chart" data-i="n_chart"></a><a href="#backtest" data-v="backtest" data-i="n_backtest"></a><a href="#risk" data-v="risk" data-i="n_risk"></a><a href="#alerts" data-v="alerts" data-i="n_alerts"></a><a href="#config" data-v="config" data-i="n_config"></a>
  </nav></div>
</header>

<main class="wrap">
<section class="view" id="v-dashboard">
  <h2 id="finding"></h2>
  <div class="lede" id="findsub" style="margin:0"></div>
  <div class="kpis" id="kpis"></div>
  <div class="dgrid">
    <div class="panel">
      <div class="chead"><b id="dSym">—</b><span id="dInfo" class="key"></span></div>
      <div class="fig" id="dFig"><svg></svg></div>
      <div class="chips lyr" style="margin-top:8px">LAYERS</div>
      <div class="key" style="margin-top:8px">KEY</div>
    </div>
    <div class="panel plan" id="planCard"></div>
  </div>
  <h3 style="margin-top:22px" data-i="board"></h3>
  <div class="scroll"><table id="board"></table></div>
  <details class="guide"><summary data-i="guide_t"></summary><div data-ih="guide_html"></div></details>
</section>

<section class="view" id="v-scanner">
  <h2 data-i="n_scanner"></h2>
  <div class="bar-row">
    <label><span data-i="universe"></span><select id="sMode"><option value="watch" data-i="u_watch"></option><option value="all" data-i="u_all"></option></select></label>
    <div class="chips" id="sFilter"><button data-f="sig" class="on" data-i="f_sig"></button><button data-f="ICH" data-i="f_ich"></button><button data-f="FIB" data-i="f_fib"></button><button data-f="above" data-i="f_above"></button><button data-f="all" data-i="f_all"></button></div>
  </div>
  <div class="scroll"><table id="sTable"></table></div>
  <p class="note" id="sNote"></p>
</section>

<section class="view" id="v-chart">
  <h2 data-i="n_chart"></h2>
  <div class="bar-row">
    <label>Pair<input id="cSym" value="BTCUSDT" size="12" autocomplete="off" spellcheck="false"></label>
    <label>Timeframe<select id="cTf"><option value="1h">1H</option><option value="4h" selected>4H</option><option value="1d">1D</option></select></label>
    <button id="cLoad" data-i="load"></button>
  </div>
  <div class="panel">
    <div class="chead"><b id="cTitle">—</b><span id="cInfo" class="key"></span></div>
    <div class="fig" id="cFig" style="min-height:520px"><svg></svg></div>
    <div class="chips lyr" style="margin-top:8px">LAYERS</div>
    <div class="key" style="margin-top:8px">KEY</div>
  </div>
  <div class="dgrid" style="margin-top:18px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="panel" id="cIchi"></div>
    <div class="panel" id="cFib"></div>
  </div>
  <h3 style="margin-top:18px" data-i="hist"></h3>
  <div class="scroll"><table id="cHist"></table></div>
</section>

<section class="view" id="v-backtest">
  <h2 data-i="n_backtest"></h2>
  <p class="warnbox" data-i="bt_warn"></p>
  <div class="bar-row">
    <label>Pair<input id="bSym" value="ETHUSDT" size="12" autocomplete="off" spellcheck="false"></label>
    <label>Timeframe<select id="bTf"><option value="1h">1H</option><option value="4h">4H</option><option value="1d" selected>1D</option></select></label>
    <label><span data-i="history"></span><select id="bN"><option value="1000">1,000</option><option value="2000" selected>2,000</option><option value="3000">3,000</option></select></label>
    <label><span data-i="c_playbook"></span><select id="bMode"><option value="both" data-i="pb_both"></option><option value="ich" data-i="pb_ich"></option><option value="fib" data-i="pb_fib"></option></select></label>
    <button class="pri" id="bRun" data-i="run"></button>
  </div>
  <div id="bOut"></div>
</section>

<section class="view" id="v-risk">
  <h2 data-i="r_title"></h2>
  <div class="calc">
    <div class="panel form" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <label>Pair<input id="rSym" value="SOLUSDT"></label>
      <label><span data-i="cf_equity"></span><input id="rEq" type="number" step="any"></label>
      <label><span data-i="cf_riskp"></span><input id="rRisk" type="number" step="0.1"></label>
      <label><span data-i="cf_maxAlloc"></span><input id="rAlloc" type="number" step="1"></label>
      <label>Entry<input id="rEntry" type="number" step="any" value="150"></label>
      <label>Stop loss<input id="rStop" type="number" step="any" value="144"></label>
    </div>
    <div class="panel">
      <small style="color:var(--mute)" data-i="r_qty"></small>
      <div class="big" id="rQty">—</div>
      <div class="kv" id="rKv"></div>
      <p class="note" id="rNote"></p>
    </div>
  </div>
  <h3 style="margin-top:24px" data-i="rules"></h3>
  <div class="scroll"><table id="rRules"></table></div>
</section>

<section class="view" id="v-alerts">
  <h2 data-i="n_alerts"></h2>
  <p class="lede" data-i="a_lede"></p>
  <div class="tgbox"><button class="pri" id="aTestSig" data-i="test_sig"></button><button id="aTest" data-i="test_msg"></button><span id="tgMsg"></span></div>
  <div class="bar-row"><button id="aCopy" data-i="copy_all"></button><button id="aClear" data-i="clear"></button><label><span data-i="auto"></span><select id="aAuto"><option value="0" data-i="off"></option><option value="1" data-i="every1"></option><option value="4" data-i="every4"></option></select></label></div>
  <div id="aList"></div>
</section>

<section class="view" id="v-config">
  <h2 data-i="n_config"></h2>
  <form id="cfgForm">
    <fieldset><legend data-i="cf_data"></legend><div class="form">
      <label><span data-i="cf_endpoint"></span><select id="k_endpoint"><option value="https://data-api.binance.vision">data-api.binance.vision</option><option value="https://api.binance.com">api.binance.com</option><option value="https://api1.binance.com">api1.binance.com</option><option value="https://api.binance.us">api.binance.us (US)</option></select></label>
      <label><span data-i="cf_token"></span><input id="k_tgToken" type="password" autocomplete="off" placeholder="123456:ABC…"></label>
      <label><span data-i="cf_chat"></span><input id="k_tgChat" autocomplete="off" placeholder="123456789"></label>
      <label class="cb"><input id="k_tgOn" type="checkbox"><span data-i="cf_tgon"></span></label>
    </div><p class="note" data-i="cf_tgnote"></p></fieldset>
    <fieldset><legend data-i="universe"></legend><div class="form">
      <label style="grid-column:1/-1"><span data-i="cf_watch"></span><input id="k_watch"></label>
      <label><span data-i="cf_topN"></span><input id="k_topN" type="number"></label>
      <label><span data-i="cf_minVol"></span><input id="k_minVol" type="number"></label>
    </div></fieldset>

<script>
{
//ENGINE-START
const clamp=(x,lo=0,hi=1)=>Math.max(lo,Math.min(hi,isNaN(x)?lo:x));
function sma(s,n){const o=new Array(s.length).fill(NaN);let sum=0;for(let i=0;i<s.length;i++){sum+=s[i];if(i>=n)sum-=s[i-n];if(i>=n-1)o[i]=sum/n}return o}
function rma(s,n){const o=new Array(s.length).fill(NaN);const st=s.findIndex(x=>!isNaN(x));if(st<0)return o;let sum=0,p=NaN;for(let i=st;i<s.length;i++){if(i<st+n-1){sum+=s[i];continue}if(i===st+n-1){sum+=s[i];p=sum/n}else p=(p*(n-1)+s[i])/n;o[i]=p}return o}
function rsi(c,n){const g=c.map((x,i)=>i?Math.max(x-c[i-1],0):NaN),d=c.map((x,i)=>i?Math.max(c[i-1]-x,0):NaN);const ag=rma(g,n),al=rma(d,n);return ag.map((a,i)=>isNaN(a)?NaN:al[i]===0?100:100-100/(1+a/al[i]))}
function trueRange(h,l,c){return c.map((x,i)=>i?Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])):h[i]-l[i])}
function atr(h,l,c,n){return rma(trueRange(h,l,c),n)}
/* Ichimoku: midpoint of highest high and lowest low over n bars */
function midHL(h,l,n){const o=new Array(h.length).fill(NaN);for(let i=n-1;i<h.length;i++){let hh=-Infinity,ll=Infinity;for(let j=i-n+1;j<=i;j++){if(h[j]>hh)hh=h[j];if(l[j]<ll)ll=l[j]}o[i]=(hh+ll)/2}return o}
/* sa/sb = Senkou A/B as computed on bar i (plotted D bars ahead = the future cloud).
   A/B/top/bot = the cloud that sits under bar i (computed D bars ago). D = displacement-1, as on TradingView. */
function ichiCore(h,l,c,cfg){const n=c.length,D=Math.max(1,cfg.shift-1),tk=midHL(h,l,cfg.tenkan),kj=midHL(h,l,cfg.kijun),sb=midHL(h,l,cfg.senkou),sa=tk.map((x,i)=>(x+kj[i])/2);
 const A=new Array(n).fill(NaN),B=new Array(n).fill(NaN);for(let i=D;i<n;i++){A[i]=sa[i-D];B[i]=sb[i-D]}
 return{tk,kj,sa,sb,A,B,top:A.map((a,i)=>Math.max(a,B[i])),bot:A.map((a,i)=>Math.min(a,B[i])),D}}
/* fractal pivots; a pivot at j is only known at bar j+k (lph/lpl hold the last CONFIRMED pivot per bar) */
function pivots(h,l,k){const n=h.length,ph=[],pl=[];for(let i=k;i<n-k;i++){let a=true,b=true;for(let j=1;j<=k;j++){if(!(h[i]>h[i-j]&&h[i]>=h[i+j]))a=false;if(!(l[i]<l[i-j]&&l[i]<=l[i+j]))b=false}if(a)ph.push(i);if(b)pl.push(i)}
 const lph=new Array(n).fill(-1),lpl=new Array(n).fill(-1);let a=0,b=0,ca=-1,cb=-1;for(let i=0;i<n;i++){while(a<ph.length&&ph[a]+k<=i)ca=ph[a++];while(b<pl.length&&pl[b]+k<=i)cb=pl[b++];lph[i]=ca;lpl[i]=cb}return{ph,pl,lph,lpl}}
function compute(b,cfg){const c=b.map(x=>x.c),h=b.map(x=>x.h),l=b.map(x=>x.l),o=b.map(x=>x.o),v=b.map(x=>x.v);const K=ichiCore(h,l,c,cfg),P=pivots(h,l,cfg.fibPivot);
 return{b,c,h,l,o,v,n:b.length,at:atr(h,l,c,14),vs:sma(v,20),r14:rsi(c,14),...K,...P,pk:cfg.fibPivot}}
/* Ichimoku reading on bar i (Bab 4: Kumo, thickness, Tenkan-Kijun, Chikou) */
function ichiAt(I,i,cfg){const c=I.c[i],top=I.top[i],bot=I.bot[i],D=I.D,at=I.at[i],j=i-D,sb=cfg.slopeBars;
 if(j<2||i<sb||isNaN(top)||isNaN(at)||!(at>0)||isNaN(I.top[j])||isNaN(I.kj[i-sb]))return null;
 let mx=-Infinity,mn=Infinity;for(let q=j-2;q<=j+2;q++){mx=Math.max(mx,I.h[q]);mn=Math.min(mn,I.l[q])}
 return{pos:c>top?1:c<bot?-1:0,tkUp:I.tk[i]>I.kj[i],kjSlope:(I.kj[i]-I.kj[i-sb])/at,chFree:c>mx&&c>I.top[j],chBear:c<mn&&c<I.bot[j],chAbove:c>I.c[j],thick:(top-bot)/at,futBull:I.sa[i]>I.sb[i],ext:(c-I.kj[i])/at,top,bot,tk:I.tk[i],kj:I.kj[i]}}
/* last up-leg for Fibonacci (Bab 2.3): confirmed swing high, swing low before it; null while price is still making new highs */
function fibAt(I,i,cfg){const ih=I.lph[i];if(ih<0)return null;const H=I.h[ih];for(let j=ih+1;j<=i;j++)if(I.h[j]>H)return null;
 let pli=-1;for(let q=I.pl.length-1;q>=0;q--)if(I.pl[q]<ih){pli=I.pl[q];break}
 const from=Math.max(0,ih-cfg.fibLook,pli);let il=from;for(let j=from;j<=ih;j++)if(I.l[j]<I.l[il])il=j;
 const L=I.l[il],leg=H-L,at=I.at[ih];if(!(leg>0)||!(at>0)||leg<cfg.fibMinLeg*at||il>=ih)return null;
 let pph=-1;for(let q=I.ph.length-1;q>=0;q--)if(I.ph[q]<ih){pph=I.ph[q];break}
 let minL=Infinity,minC=Infinity;for(let j=ih+1;j<=i;j++){minL=Math.min(minL,I.l[j]);minC=Math.min(minC,I.c[j])}
 const floor=H-(cfg.fib786?1:0.786)*leg;
 return{ih,il,H,L,leg,hh:pph<0||H>I.h[pph],depth:isFinite(minL)?(H-minL)/leg:0,broken:minC<floor,bars:i-ih,e1:L+1.272*leg,e2:L+1.618*leg}}
const fibLv=(F,r)=>F.H-r*F.leg;
const FIB_W={0.382:8,0.5:11,0.618:15,0.786:9};
function plan(strat,setup,c,stop,at,x){const R=c-stop,o={strat,setup,entry:c,stop,atr:at,zoneLo:Math.max(stop+0.25*at,c-0.25*at)};
 if(strat==='ICH')Object.assign(o,{tp1:c+R,tp2:c+2*R,tp3:c+3*R,alloc:[33,33,34],tpMode:'R',rr:2});
 else Object.assign(o,{tp1:x.tp1,tp2:x.tp2,tp3:x.tp3,alloc:[50,30,20],tpMode:'abs',rr:(x.tp2-c)/R});
 o.maxChase=Math.min(c+0.5*at,(o.tp1+c)/2);return o}
function swingLow(I,i,n){let m=Infinity;for(let q=Math.max(0,i-n+1);q<=i;q++)m=Math.min(m,I.l[q]);return m}
/* --- Ichimoku setups (Bab 6, 7, 8). Each returns {setup,stop} or null --- */
function tkFire(I,ii,d,cfg){const X=ichiAt(I,ii,cfg),j=ii-d;if(!X||j<1)return false;
 if(!(I.tk[j]>I.kj[j]&&I.tk[j-1]<=I.kj[j-1]))return false;for(let q=j;q<=ii;q++)if(!(I.tk[q]>I.kj[q]))return false;
 return I.c[ii]>I.c[j]&&X.pos===1&&X.futBull&&X.kjSlope>0&&X.chFree&&X.ext<=cfg.maxExt}
function kbFire(I,ii,cfg){const X=ichiAt(I,ii,cfg);if(!X||ii<3)return false;const at=I.at[ii],k=ii-1;
 return I.c[ii-2]<=I.top[ii-2]&&I.c[k]>I.top[k]&&I.c[k]>I.o[k]&&I.c[k]-I.o[k]>=cfg.bkBody*at&&X.pos===1&&I.c[ii]>I.c[k]&&X.tkUp&&X.futBull&&X.chFree&&X.ext<=cfg.maxExt}
function trFire(I,ii,cfg){const X=ichiAt(I,ii,cfg);if(!X||ii<cfg.trBars+2)return false;const at=I.at[ii];let above=0;
 for(let q=ii-cfg.trBars+1;q<=ii;q++){if(!(I.c[q]>I.bot[q]))return false;if(I.c[q]>I.top[q])above++}
 if(above<cfg.trBars-2||X.pos!==1||X.thick<cfg.minThick||!(I.kj[ii]>I.kj[ii-10]))return false;
 const mn=Math.min(I.l[ii],I.l[ii-1]);if(!(mn<=I.tk[ii]+0.1*at&&mn>=X.top-0.5*at))return false;
 const pa=paAt(I,ii);return I.c[ii]>I.o[ii]&&I.c[ii]>X.kj&&I.c[ii]>X.tk&&(pa&&pa.d>0||I.c[ii]>I.h[ii-1])&&X.ext<=cfg.maxExt}
function evalAt(I,i,cfg,ctx){
 if(i<cfg.senkou+I.D+12)return null;const X=ichiAt(I,i,cfg);if(!X)return null;
 const c=I.c[i],at=I.at[i],hs=I.htf?I.htf[i]:NaN,F=fibAt(I,i,cfg),ret20=i>=20?c/I.c[i-20]-1:0;
 const out={regime:X.pos===1?'Above':X.pos===-1?'Below':'Inside',X,F,rs:ret20-(ctx?ctx.btcRet20:0),price:c,atr:at,rsi14:I.r14[i],sig:null,t:I.b[i].t,htf:hs};
 const riskOff=!!(ctx&&!ctx.btcRiskOn),buf=cfg.slBuf*at,volR=I.vs[i]?I.v[i]/I.vs[i]:1,cands=[];
 const ichOk=!cfg.mtf||hs===1;
 const ichScore=()=>(X.pos===1?15:0)+(X.futBull?10:0)+(X.tkUp?10:0)+clamp(X.kjSlope/0.5)*10+(X.chFree?15:X.chAbove?6:0)+clamp(X.thick/1.5)*10+15*(1-clamp((X.ext-1)/cfg.maxExt))+(hs===1?10:0)+clamp(volR/2)*5;
 const addIch=(setup,stop)=>{if(!(c-stop>0)||c-stop>cfg.maxSlAtr*at)return;cands.push({...plan('ICH',setup,c,stop,at),score:ichScore()})};
 if(ichOk){
  if(cfg.enTK&&(tkFire(I,i,1,cfg)||(tkFire(I,i,2,cfg)&&!tkFire(I,i-1,1,cfg)))){let st=X.kj-buf;if(c-st<at)st=Math.min(st,swingLow(I,i,5)-buf);addIch('TK Cross',st)}
  if(cfg.enKB&&kbFire(I,i,cfg))addIch('Kumo Breakout',X.bot-buf);
  if(cfg.enTR&&trFire(I,i,cfg)&&!trFire(I,i-1,cfg))addIch('Kijun Pullback',swingLow(I,i,5)-buf)}
 /* --- Fibonacci retracement + price action confluence (Bab 2, 4, 7) --- */
 if(cfg.enFIB&&F&&!F.broken&&F.hh&&F.bars>=2&&X.pos!==-1&&(!cfg.mtf||hs!==-1)){
  const mn=Math.min(I.l[i],I.l[i-1]),tol=0.1*at;let r=null;
  for(const q of (cfg.fib786?[0.382,0.5,0.618,0.786]:[0.382,0.5,0.618])){const p=fibLv(F,q);if(mn<=p+tol&&c>p)r=q}
  const pa=paAt(I,i),pp=paAt(I,i-1),cand=!!(pa&&pa.d>0)||(!!pp&&pp.k==='hammer'&&c>I.h[i-1]&&c>I.o[i]);
  if(r!==null&&cand&&c<F.H){const lp=fibLv(F,r),near=p=>Math.abs(p-lp)<=0.5*at;
   let oldSR=false;for(let q=I.ph.length-1;q>=0&&!oldSR;q--){const j=I.ph[q];if(j<F.il&&j+I.pk<=i&&near(I.h[j]))oldSR=true}
   for(let q=I.pl.length-1;q>=0&&!oldSR;q--){const j=I.pl[q];if(j<F.il&&j+I.pk<=i&&near(I.l[j]))oldSR=true}
   const ichConf=near(X.kj)||near(X.top)||near(X.tk),f={fib:true,sr:oldSR||ichConf,cand:true,htf:hs===1,vol:volR>=1},fs=Object.values(f).filter(Boolean).length;
   const stop=mn-buf,R=c-stop,pl=plan('FIB','Fib '+(r*100).toFixed(1).replace('.0',''),c,stop,at,{tp1:F.H,tp2:F.e1,tp3:F.e2});
   if(fs>=cfg.fibMinScore&&R>0&&R<=cfg.maxSlAtr*at&&pl.rr>=cfg.fibMinRR)
    cands.push({...pl,score:fs*12+FIB_W[r]+(X.pos===1?10:4)+(ichConf?10:0)+clamp((pl.rr-2)/2)*5,fibLevel:r,fibScore:fs,fibF:f,ichConf})}}
 if(cands.length){const best=cands.sort((a,b)=>b.score-a.score)[0];best.score=Math.round(clamp(best.score-(riskOff?10:0),0,100));best.riskOff=riskOff;if(!(riskOff&&cfg.btcBlock))out.sig=best}

/* Backtest: signal on close of bar i, fill at open of i+1, structural stop, scale-outs, trailing (Kijun for ICH, swing lows for FIB) */
function backtest(I,cfg,mode){
 const n=I.n,fee=cfg.fee/100,slip=cfg.slip/100,risk=cfg.risk/100,start=Math.min(cfg.senkou+I.D+12,n-1);
 let eq=1,pos=null,pend=null,exitPend=null,inBars=0;const trades=[],curve=[];
 const nr=px=>px*(1-slip)*(1-fee)/(pos.entry*(1+fee))-1;
 const fill=(px,p)=>{if(p<=0)return;pos.real+=pos.frac*p*nr(px);pos.Rsum+=p*(px*(1-slip)*(1-fee)-pos.entry*(1+fee))/(pos.entry-pos.stop0);pos.rem-=p};
 const done=(i,why)=>{eq=pos.eq0*(1+pos.real);trades.push({strat:pos.strat,setup:pos.setup,t0:I.b[pos.i0].t,t1:I.b[i].t,entry:pos.entry,ret:pos.real,R:pos.Rsum,bars:i-pos.i0+1,why,hits:pos.hits});pos=null};
 const stopWhy=gap=>pos.stop>pos.entry*1.0001?'trail':pos.stop>=pos.entry*0.9999?'be':gap?'gap':'stop';
 for(let i=start;i<n;i++){
  const o=I.o[i],h=I.h[i],l=I.l[i],c=I.c[i];
  if(exitPend&&pos){fill(o,pos.rem);done(i,exitPend)}exitPend=null;
  if(pend&&!pos){const entry=o*(1+slip),stop=pend.stop,dist=entry-stop;let tps=null;
   if(dist>0){if(pend.strat==='ICH')tps=[{px:entry+dist,p:1/3},{px:entry+2*dist,p:1/3}];
    else if(pend.tp1>entry)tps=[{px:pend.tp1,p:0.5},{px:pend.tp2,p:0.3},{px:pend.tp3,p:0.2}]}
   if(tps)pos={strat:pend.strat,setup:pend.setup,i0:i,entry,stop,stop0:stop,tps,frac:Math.min(risk/(dist/entry),1),eq0:eq,real:0,Rsum:0,rem:1,hits:0}}
  pend=null;
  if(pos){
   if(o<=pos.stop){const w=stopWhy(true);fill(o,pos.rem);done(i,w)}
   else if(l<=pos.stop){const w=stopWhy(false);fill(pos.stop,pos.rem);done(i,w)}
   else while(pos&&pos.tps.length&&h>=pos.tps[0].px){const tp=pos.tps.shift();fill(Math.max(tp.px,o),Math.min(tp.p,pos.rem));pos.hits++;pos.stop=Math.max(pos.stop,pos.entry);if(pos.rem<=1e-9)done(i,'tp')}}
  if(pos){inBars++;
   if(pos.strat==='ICH'){const tr=I.kj[i]-cfg.slBuf*I.at[i];if(tr>pos.stop&&tr<c)pos.stop=tr;
    if(cfg.exitMode==='cross'?(I.tk[i]<I.kj[i]&&I.tk[i-1]>=I.kj[i-1]):c<I.kj[i])exitPend=cfg.exitMode==='cross'?'cross':'kijun'}
   else if(pos.hits>=1&&i>=2){const j=i-2;if(j>pos.i0&&I.l[j]<I.l[j-1]&&I.l[j]<I.l[j-2]&&I.l[j]<=I.l[j+1]&&I.l[j]<=I.l[i]){const tr=I.l[j]-0.1*I.at[i];if(tr>pos.stop&&tr<c)pos.stop=tr}}}
  if(!pos&&i<n-1){const ev=evalAt(I,i,cfg,null);if(ev&&ev.sig&&(mode==='both'||mode===ev.sig.strat.toLowerCase()))pend=ev.sig}
  const mtm=pos?pos.eq0*(1+pos.real+pos.frac*pos.rem*nr(c)):eq;
  curve.push({t:I.b[i].t,eq:mtm,bh:c/I.c[start]})}
 if(pos){fill(I.c[n-1],pos.rem);done(n-1,'open')}
 if(curve.length)curve[curve.length-1].eq=eq;
 let peak=0,dd=0;for(const p of curve){peak=Math.max(peak,p.eq);dd=Math.max(dd,1-p.eq/peak)}
 const w=trades.filter(t=>t.R>0),ls=trades.filter(t=>t.R<=0),gw=w.reduce((s,t)=>s+t.R,0),gl=-ls.reduce((s,t)=>s+t.R,0);
 return{trades,curve,stats:{n:trades.length,win:trades.length?w.length/trades.length:0,pf:gl?gw/gl:(gw?Infinity:0),avgR:trades.length?(gw-gl)/trades.length:0,ret:eq-1,dd,bh:curve.length?curve[curve.length-1].bh-1:0,exp:curve.length?inBars/curve.length:0,ich:trades.filter(t=>t.strat==='ICH').length,fib:trades.filter(t=>t.strat==='FIB').length}}}
/* higher timeframe = Ichimoku golden rule on the HTF: above Kumo 1, below -1, inside 0 */
function htfStates(H,cfg){const c=H.map(x=>x.c),K=ichiCore(H.map(x=>x.h),H.map(x=>x.l),c,cfg);return H.map((x,i)=>({ct:x.ct,s:isNaN(K.top[i])?NaN:c[i]>K.top[i]?1:c[i]<K.bot[i]?-1:0}))}
function alignHtf(I,hs){const out=new Array(I.n).fill(NaN);let j=-1;for(let i=0;i<I.n;i++){const ct=I.b[i].ct;while(j+1<hs.length&&hs[j+1].ct<=ct)j++;out[i]=j>=0?hs[j].s:NaN}return out}
function smc(I,k=3){const n=I.n,h=I.h,l=I.l,c=I.c,o=I.o,sw=[];
 for(let i=k;i<n-k;i++){let ph=true,pl=true;for(let j=1;j<=k;j++){if(!(h[i]>h[i-j]&&h[i]>=h[i+j]))ph=false;if(!(l[i]<l[i-j]&&l[i]<=l[i+j]))pl=false}if(ph)sw.push({i,p:h[i],hi:true});if(pl)sw.push({i,p:l[i],hi:false})}
 let pH=null,pL=null;for(const q of sw){if(q.hi){q.lb=pH?(q.p>pH.p?'HH':'LH'):'';pH=q}else{q.lb=pL?(q.p>pL.p?'HL':'LL'):'';pL=q}}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(path,params,tries=2){const q=new URLSearchParams(params).toString();
 for(let k=1;;k++){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);let retryMs=0,err;
  try{const r=await fetch(cfg.endpoint+path+(q?'?'+q:''),{signal:ctl.signal});const j=await r.json().catch(()=>null);if(r.ok)return j;
   err=new Error((j&&j.msg)||('HTTP '+r.status));err.status=r.status;if(r.status===429||r.status===418)retryMs=Math.min(10,+(r.headers.get('Retry-After')||2))*1000;else if(r.status>=500)retryMs=1500}
  catch(e){err=new Error(e.name==='AbortError'?'timeout':e.message);retryMs=1500}finally{clearTimeout(to)}
  if(k>=tries||!retryMs)throw err;await sleep(retryMs)}}
async function probeLive(){try{await api('/api/v3/ping',{});live=true;liveErr=''}catch(e){live=false;liveErr=e.message}return live}
async function getKlines(sym,tf,n){
 if(!live)return demoBars(sym,tf,n,Date.now());
 let out=[],end=null;
 while(out.length<n){const lim=Math.min(1000,n-out.length+1);const inp={symbol:sym,interval:tf,limit:lim};if(end)inp.endTime=end;
  const raw=await api('/api/v3/klines',inp);if(!Array.isArray(raw))throw new Error('bad kline data');if(!raw.length)break;
  const bars=raw.map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[7],ct:+k[6]}));
  out=bars.concat(out.filter(b=>b.t>bars[bars.length-1].t));end=bars[0].t-1;if(raw.length<lim)break}
 return out.filter(b=>b.ct<Date.now())}

 $('bOut').innerHTML=`<h3>${sym} ${U(tf)} · ${tstr(bars[start].t)} – ${tstr(bars[bars.length-1].t)}${live?'':' · demo'}</h3><div class="kpis">${kpi(t('net'),pct(st.ret),t('bh')+' '+pct(st.bh))+kpi(t('dd'),pct(-st.dd))+kpi(t('trades'),st.n,st.ich+' Ichimoku · '+st.fib+' Fibonacci')+kpi(t('win'),(st.win*100).toFixed(0)+'%')+kpi(t('pf'),isFinite(st.pf)?st.pf.toFixed(2):'∞','R')+kpi(t('expct'),(st.avgR>=0?'+':'')+st.avgR.toFixed(2)+'R',t('pertrade'))+kpi(t('tim'),(st.exp*100).toFixed(0)+'%')}</div>
 <div class="panel"><div class="fig sm" id="eqFig"><svg></svg></div></div>
 ${st.n<30?`<p class="warnbox" style="margin-top:14px">${t('small')}</p>`:''}
 ${bys?`<h3 style="margin-top:18px">${t('bysetup')}</h3><div class="scroll"><table><thead><tr><th>Setup</th><th class="n">${t('trades')}</th><th class="n">${t('win')}</th><th class="n">${t('pf')}</th><th class="n">${t('expct')}</th></tr></thead><tbody>${bys}</tbody></table></div>`:''}
 <h3 style="margin-top:18px">${t('tlist')}</h3><div class="scroll"><table><thead><tr><th>Entry</th><th>${t('c_playbook')}</th><th class="n">Entry</th><th class="n">TP</th><th class="n">${t('c_bars')}</th><th class="n">R</th><th class="n">${t('c_ret')}</th><th>${t('c_exit')}</th></tr></thead><tbody>${R.trades.slice(-40).reverse().map(x=>`<tr><td>${tstr(x.t0)}</td><td><span class="pill ${x.strat}">${pbName(x)}</span></td><td class="n">${fmtP(x.entry)}</td><td class="n">${x.hits}</td><td class="n">${x.bars}</td><td class="n" style="color:${x.R>0?'var(--tp)':'var(--sl)'}">${x.R.toFixed(2)}</td><td class="n">${pct(x.ret,2)}</td><td>${t('why_'+x.why)}</td></tr>`).join('')||`<tr><td colspan="8"><div class="empty">—</div></td></tr>`}</tbody></table></div>
 <p class="note">${t('bt_note',cfg.risk,cfg.fee,cfg.slip)}</p>`;
 plot($('eqFig'),{kind:'eq',curve:R.curve})}
function calc(){const eq=+$('rEq').value,rk=+$('rRisk').value/100,al=+$('rAlloc').value/100,en=+$('rEntry').value,sp=+$('rStop').value;
 if(!(eq>0&&en>0&&sp>0&&sp<en)){$('rQty').textContent='—';$('rKv').innerHTML='';$('rNote').textContent=t('r_bad');return}
 let qty=eq*rk/(en-sp),capped=false;if(al>0&&qty*en>eq*al){qty=eq*al/en;capped=true}const d=en-sp,base=$('rSym').value.toUpperCase().replace('USDT','');
 $('rQty').textContent=fmtQ(qty)+' '+base;
 $('rKv').innerHTML=[[t('pos_val'),fmtP(qty*en)+' USDT'],[t('share'),(qty*en/eq*100).toFixed(1)+'%'],[t('loss'),fmtP(qty*d)+' USDT ('+(qty*d/eq*100).toFixed(2)+'%)'],[t('sdist'),(d/en*100).toFixed(2)+'%'],['Entry → SL',pct(-d/en,2)],['1R',fmtP(en+d)+' · '+pct(d/en,2)],['2R (min 1:2)',fmtP(en+2*d)+' · '+pct(2*d/en,2)],['3R',fmtP(en+3*d)+' · '+pct(3*d/en,2)]].map(([a,b])=>`<span>${a}</span><span>${b}</span>`).join('');
 $('rNote').textContent=capped?t('r_cap',al*100,rk*100):t('r_formula')}
function renderRules(){const heat=S.results.filter(r=>r.sig).length*cfg.risk;
 $('rRules').innerHTML=`<thead><tr><th>${t('c_rule')}</th><th class="n">${t('c_limit')}</th><th>${t('c_why')}</th></tr></thead><tbody>`+t('ru',cfg,heat).map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td style="white-space:normal">${r[2]}</td></tr>`).join('')+'</tbody>'}
function renderAlerts(){$('aList').innerHTML=S.alerts.length?S.alerts.slice(0,60).map(a=>`<div class="alert"><span class="pill ${a.sig.strat}">${pbName(a.sig)}</span> <b>${esc(a.sym)}</b> ${U(a.tf)} · Entry ${fmtP(a.sig.entry)} · SL ${fmtP(a.sig.stop)} · TP1 ${fmtP(a.sig.tp1)} · TP2 ${fmtP(a.sig.tp2)} · ${t('c_score')} ${a.sig.score}${a.prob&&a.prob.n?' · '+t('conf')+' '+t('g_'+a.prob.grade)+' (TP1 '+(a.prob.p1*100).toFixed(0)+'%)':''}${a.demo?' · demo':''}<small>${tstr(a.at)}</small></div>`).join(''):`<div class="empty">${t('noalerts')}</div>`;$('aAuto').value=String(cfg.auto)}
function fillCfg(){for(const k in DEF){const el=$('k_'+k);if(!el)continue;if(el.type==='checkbox')el.checked=!!cfg[k];else el.value=cfg[k]}$('qtf').value=cfg.tf;$('sMode').value=cfg.mode;$('rEq').value=cfg.equity;$('rRisk').value=cfg.risk;$('rAlloc').value=cfg.maxAlloc}
function planFor(sym){const r=S.results.find(x=>x.sym===sym);if(!r||!r.sig)return;S.dSym=sym;location.hash='dashboard';showDash(sym);$('rSym').value=sym;$('rEntry').value=+r.sig.entry.toPrecision(6);$('rStop').value=+r.sig.stop.toPrecision(6);calc()}
function testSignal(){const r=S.results.find(x=>x.sym===S.dSym&&x.sig)||S.results.find(x=>x.sig);if(r)return{sym:r.sym,sig:r.sig,prob:r.prob,ex:r};
 const I=S.cache['BTCUSDT'+S.scanTf];if(!I)return null;const i=I.n-1,c=I.c[i],at=I.at[i];let st=I.kj[i]-cfg.slBuf*at;if(!(st<c-0.5*at))st=c-2*at;const sig={...plan('ICH','TK Cross',c,st,at),score:70,riskOff:false};const rb=S.results.find(x=>x.sym==='BTCUSDT');return{sym:'BTCUSDT',sig,prob:probOf(eventStats(I,cfg,'ICH'),'pair'),ex:rb}}
function applyLang(){document.documentElement.lang=lang;for(const el of document.querySelectorAll('[data-i]'))el.textContent=t(el.dataset.i);for(const el of document.querySelectorAll('[data-ih]'))el.innerHTML=t(el.dataset.ih);
 for(const b of document.querySelectorAll('#langSeg button'))b.classList.toggle('on',b.dataset.lang===lang);setStatus();if(S.lastScan)renderAll();else renderDash();renderRules();calc();renderBt();if(figs.has($('cFig')))loadChart()}

/* ---------- theme ---------- */
const mqDark=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
const curTheme=()=>document.documentElement.getAttribute('data-theme')||(mqDark&&mqDark.matches?'dark':'light');
function applyTheme(th){if(th)document.documentElement.setAttribute('data-theme',th);const c=curTheme();
 for(const b of document.querySelectorAll('#themeSeg button')){b.classList.toggle('on',b.dataset.themeSet===c);b.setAttribute('aria-pressed',b.dataset.themeSet===c)}
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=c==='dark'?'#0e1116':'#ffffff';
 for(const [el,d] of figs)drawChart(el,d)}
$('themeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;LS.set('theme',b.dataset.themeSet);applyTheme(b.dataset.themeSet)};
if(mqDark&&mqDark.addEventListener)mqDark.addEventListener('change',()=>applyTheme());

/* ---------- routing & events ---------- */
const VIEWS=['dashboard','scanner','chart','backtest','risk','alerts','config'];
function route(){const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'dashboard';for(const x of VIEWS)$('v-'+x).classList.toggle('on',x===v);for(const a of document.querySelectorAll('nav a'))a.classList.toggle('on',a.dataset.v===v);
 if(v==='chart'&&!figs.has($('cFig'))&&S.lastScan)loadChart();for(const [el,d] of figs)drawChart(el,d)}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const b=e.target.closest('.lyr button');if(!b)return;S.layers[b.dataset.ly]=!S.layers[b.dataset.ly];LS.set('layers',S.layers);paintLayers();for(const [el,d] of figs)drawChart(el,d)});
$('langSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.lang;LS.set('lang',lang);applyLang()};
$('scanBtn').onclick=scan;
$('qtf').onchange=e=>{cfg.tf=e.target.value;LS.set('cfg',cfg);scan()};
$('sMode').onchange=e=>{cfg.mode=e.target.value;LS.set('cfg',cfg);scan()};
$('sFilter').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.filter=b.dataset.f;for(const x of $('sFilter').children)x.classList.toggle('on',x===b);renderScanner()};
$('sTable').onclick=e=>{const p=e.target.closest('[data-plan]');if(p){planFor(p.dataset.plan);return}const tr=e.target.closest('tr[data-sym]');if(tr){$('cSym').value=tr.dataset.sym;$('cTf').value=S.scanTf;location.hash='chart';loadChart()}};
$('board').onclick=e=>{const tr=e.target.closest('tr[data-sym]');if(tr)showDash(tr.dataset.sym)};
$('cLoad').onclick=loadChart;$('cSym').onkeydown=e=>{if(e.key==='Enter')loadChart()};
$('bRun').onclick=runBt;
for(const id of ['rEq','rRisk','rAlloc','rEntry','rStop','rSym'])$(id).oninput=calc;
$('aTest').onclick=async()=>{try{await sendTg('✅ '+t('tg_hello'));$('tgMsg').textContent=t('tg_ok')}catch(e){$('tgMsg').textContent=t('failed')+': '+e.message}};
$('aTestSig').onclick=async()=>{const x=testSignal();if(!x){$('tgMsg').textContent=t('connecting');return}try{await sendTg(planText(x.sym,S.scanTf,x.sig,true,x.prob,x.ex));$('tgMsg').textContent=t('sent')+': '+x.sym}catch(e){$('tgMsg').textContent=t('failed')+': '+e.message}};
$('aCopy').onclick=async e=>{const b=e.currentTarget;try{await navigator.clipboard.writeText(S.alerts.map(a=>plainText(planText(a.sym,a.tf,a.sig,a.demo,a.prob,a.ex))).join('\n\n— — —\n\n'));flash(b,t('copied'))}catch(err){flash(b,t('failed'))}};
$('aClear').onclick=()=>{S.alerts=[];LS.set('alerts',[]);renderAlerts()};
$('aAuto').onchange=e=>{cfg.auto=+e.target.value;LS.set('cfg',cfg)};
$('cfgForm').onsubmit=e=>{e.preventDefault();for(const k in DEF){const el=$('k_'+k);if(!el)continue;cfg[k]=el.type==='checkbox'?el.checked:typeof DEF[k]==='number'?(el.value===''||isNaN(+el.value)?DEF[k]:+el.value):el.value.trim()}
 for(const k of ['tenkan','kijun','senkou','shift','fibPivot','trBars','fibLook'])cfg[k]=Math.max(2,Math.round(cfg[k]));cfg.fibMinScore=Math.min(5,Math.max(2,Math.round(cfg.fibMinScore)));
 LS.set('cfg',cfg);S.cache={};figs.delete($('cFig'));$('cfgMsg').textContent=t('saved');fillCfg();calc();probeLive().then(scan)};
$('cfgReset').onclick=()=>{const keep={tgToken:cfg.tgToken,tgChat:cfg.tgChat,tgOn:cfg.tgOn};cfg={...DEF,...keep};LS.set('cfg',cfg);fillCfg();$('cfgMsg').textContent=t('restored')};
setInterval(refreshPrices,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshPrices()});
setInterval(()=>{if(cfg.auto>0&&!S.busy&&Date.now()-S.lastScan>=cfg.auto*36e5)scan()},60000);

fillCfg();applyLang();applyTheme();paintLayers();route();
(async()=>{setStatus(t('connecting'));await probeLive();await scan();if(location.hash==='#chart')loadChart()})();
}
</script>
</body>
</html>
